<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Electric Shepherd — local flame engine</title>
<link rel="stylesheet" href="css/style.css?v=2">
<!-- The ?v= on every asset below is a cache buster. index.html itself is
     served no-cache, but the CSS and JS carry a long max-age, so without a
     changing URL a CDN keeps handing out the old ones after a deploy - new
     markup against stale styles, which looks like the UI has broken. Bump
     every ?v= together when you deploy; see MAINTAINING.md. -->
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="mark">◈</span> Electric Shepherd<span class="sub">local flame engine</span></div>
    <div class="transport">
      <button id="btnPrev" class="ib" title="← — back to the sheep before this one" aria-label="Previous sheep">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon class="solid" points="19 4 9 12 19 20"/><rect class="solid" x="4.6" y="4" width="2.4" height="16" rx="1"/></svg>
      </button>
      <button id="btnPlay" class="ib primary" title="Space — play / pause" aria-label="Pause">
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect class="solid" x="6" y="4" width="4" height="16" rx="1"/><rect class="solid" x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><polygon class="solid" points="6 4 20 12 6 20"/></svg>
      </button>
      <button id="btnSkip" class="ib" title="→ — next sheep (a new random one when the stream is off)" aria-label="Next sheep">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon class="solid" points="5 4 15 12 5 20"/><rect class="solid" x="17" y="4" width="2.4" height="16" rx="1"/></svg>
      </button>
      <button id="btnRandom" class="ib" title="R — brand new random sheep" aria-label="New random sheep">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button id="btnMutate" class="ib" title="M — mutate the current sheep" aria-label="Mutate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
      <button id="btnFit" class="ib" title="F — auto-frame the flame" aria-label="Auto-frame">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/></svg>
      </button>
      <button id="btnKeep" class="ib" title="K — save to the flock" aria-label="Keep">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="btnStream" class="ib" title="S — start / stop the stream" aria-label="Start stream">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="solid" cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M7.76 16.24a6 6 0 0 1 0-8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
      </button>
      <button id="btnClearAcc" class="ib" title="C — restart the exposure" aria-label="Clear the exposure">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <select id="qualityPreset" title="Apply a quality preset tuned to your hardware">
        <option value="" selected>Quality</option>
        <option value="light">Light</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="extreme">Extreme</option>
      </select>
      <button id="btnOverlay" class="ib" title="H — show / hide the sheep details overlay" aria-label="Show sheep details">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
      <button id="btnFull" class="ib" title="V — fullscreen viewfinder (U hides the panels without going fullscreen)" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button id="btnHelp" class="ib" title="? or F1 — the handbook" aria-label="Help">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>
    <button id="btnMenu" class="mobonly menubtn" title="Open the options drawer" aria-label="Options"><svg class="mb-ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span class="mb-txt">Options</span></button>
    <div class="spacer"></div>
    <div class="readout" id="readout"></div>
  </header>

  <div class="main">
    <section class="stage">
      <div class="canvaswrap" id="canvaswrap">
        <canvas id="glcanvas"></canvas>
        <div class="overlay" id="overlay"></div>
        <button class="exitcinema" id="btnExitCinema" title="Esc — back to the panels">⛶ Exit</button>
        <div class="msg" id="msg"></div>
      </div>
      <div class="filmstrip" id="filmstrip"></div>
    </section>

    <aside class="panel" id="panel">
      <div class="drawerhead mobonly">
        <span class="dh-grip"></span>
        <span class="dh-title">Options</span>
        <button id="btnCloseDrawer" class="dh-close" title="Close" aria-label="Close options">✕</button>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="sheep" class="active">Sheep</button>
        <button data-tab="transforms">Transforms</button>
        <button data-tab="palette">Palette</button>
        <button data-tab="render">Image</button>
        <button data-tab="loop">Loop</button>
        <button data-tab="evolve">Evolve</button>
        <button data-tab="stream">Stream</button>
        <button data-tab="output">Render</button>
        <button data-tab="library">Flock</button>
      </nav>
      <div class="panes" id="panes">
        <div class="pane active" data-pane="sheep"></div>
        <div class="pane" data-pane="transforms"></div>
        <div class="pane" data-pane="palette"></div>
        <div class="pane" data-pane="render"></div>
        <div class="pane" data-pane="loop"></div>
        <div class="pane" data-pane="evolve"></div>
        <div class="pane" data-pane="stream"></div>
        <div class="pane" data-pane="output"></div>
        <div class="pane" data-pane="library"></div>
      </div>
    </aside>
  </div>
</div>

<div class="drawerscrim" id="drawerScrim"></div>

<input type="file" id="fileImport" accept=".json,application/json" multiple style="display:none">
<canvas id="thumbcanvas" width="256" height="160" style="display:none"></canvas>

<div class="loadscreen" id="loadScreen">
  <div class="loadbox">
    <div class="loadmark">◈</div>
    <div class="loadtext" id="loadText">Calibrating render quality for your hardware&hellip;</div>
    <div class="loadbar"><div class="loadbar-fill" id="loadBarFill"></div></div>
  </div>
</div>

<script src="js/variations.js?v=2"></script>
<script src="js/shaders.js?v=2"></script>
<script src="js/palette.js?v=2"></script>
<script src="js/genome.js?v=2"></script>
<script src="js/renderer.js?v=2"></script>
<script src="js/evolve.js?v=2"></script>
<script src="js/library.js?v=2"></script>
<script src="js/render.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<!-- js/help.js mirrors README.md by hand: edit both together -->
<script src="js/help.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
